name: sayarti_mobile
description: "Sayarti mobile application."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.0
  lottie: ^3.3.3
  responsive_framework: ^1.5.1
  pin_code_fields: ^8.0.1
  pin_input_text_field: ^4.5.2

  # State Management
  flutter_bloc: ^9.1.1
  rxdart: ^0.28.0

  # Networking
  dio: ^5.11.0
  retrofit: ^4.9.2
  pretty_dio_logger: ^1.4.0

  # Dependency Injection
  get_it: ^8.2.0
  injectable: ^2.7.1+4

  # Serialization / Code Generation Annotations
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Storage
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.5

  # Security / Cryptography
  encrypt: ^5.0.3
  pointycastle: ^3.9.1
  asn1lib: ^1.6.5

  # Device / Platform
  device_info_plus: ^12.4.0
  package_info_plus: ^9.0.0
  flutter_udid: ^4.1.6
  safe_device: ^1.4.1
  vpn_connection_detector: ^2.1.0
  local_auth: ^3.0.1
  path_provider: ^2.1.5
  sms_autofill: ^2.5.0

  # Identity Verification
  idwise_flutter_sdk: ^6.8.9

  # Utilities
  intl: ^0.20.2
  uuid: ^4.6.0
  tuple: ^2.0.2
  data: ^0.15.2

  # Environment
  envied: ^1.3.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.6.0
  freezed: ^3.2.5
  retrofit_generator: ^10.2.5
  injectable_generator: ^2.7.1
  json_serializable: ^6.9.5
  envied_generator: ^1.3.8

  # Lints
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true